<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#c97a3d">
  <meta name="description" content="Antwerpen-rejsen for Ronny og Jolanta">
  <link rel="stylesheet" href="antwerpen.css">
  <title>Antwerpen · Rejser</title>
</head>
<body>
  <main class="trip-shell">
    <header class="trip-top">
      <a class="back-link" href="index.html">← Rejser</a>
      <small id="tripStatus">Aktiv planlægning</small>
    </header>

    <section class="trip-hero">
      <p class="trip-kicker">BILREJSE</p>
      <h1 id="tripTitle">Antwerpen</h1>
      <p id="tripSubtitle">Bilrejse · november 2026</p>
      <span class="vehicle-pill">🚗 <span id="tripVehicle">Ford Mustang Mach-E</span></span>
    </section>

    <section id="antwerpenContent" class="section-grid" aria-live="polite">
      <article class="section-card"><h2>Indlæser rejsen …</h2></article>
    </section>

    <p class="status-note">Kun bekræftede oplysninger lægges ind som fakta. Rute, opladning, parkering og andre oplysninger udfyldes først, når de er verificeret.</p>
  </main>
  <script src="antwerpen.js"></script>
</body>
</html>
