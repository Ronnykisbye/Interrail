<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rejser ikon med fly, tog og orange elbil">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0879d9"/><stop offset="1" stop-color="#8fdcff"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe45a"/><stop offset=".55" stop-color="#ffc400"/><stop offset="1" stop-color="#e69a00"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb32b"/><stop offset=".55" stop-color="#f47b00"/><stop offset="1" stop-color="#c84e00"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09c6d4"/><stop offset="1" stop-color="#0074a8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".35"/></filter>
    <clipPath id="round"><rect width="512" height="512" rx="74"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="418" cy="92" r="55" fill="#fff3aa" opacity=".9"/>
    <path d="M0 278L88 164l58 73 58-104 86 128 62-95 70 94 90-92v202H0z" fill="#153f5f"/>
    <path d="M54 224l34-60 26 34 32 39 58-104 32 49 54 79 62-95 38 51 32 43 42-43 48-49v82l-90 102-367-18z" fill="#f7fbff" opacity=".94"/>
    <path d="M0 335c100-50 200-26 285-4 70 18 146 22 227-14v195H0z" fill="url(#water)"/>
    <path d="M0 348c73-34 137-35 198-22 80 17 161 50 314 7" fill="none" stroke="#d8ffff" stroke-width="10" opacity=".6"/>

    <!-- gold title -->
    <g filter="url(#shadow)">
      <path d="M36 38Q256-8 476 38v110Q256 107 36 148z" fill="url(#gold)" stroke="#fff1a6" stroke-width="5"/>
      <text x="256" y="111" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="900" fill="#073476">Rejser</text>
    </g>

    <!-- plane -->
    <g transform="translate(310 148) rotate(-8)" filter="url(#shadow)">
      <path d="M-83 6L3-14l54-37 13 5-32 34 58-5 18 10-75 16 24 29-10 4-43-24-67 13-17-9z" fill="#f8fbff" stroke="#0c4f93" stroke-width="3"/>
      <path d="M13-12l39-27" stroke="#77aee0" stroke-width="5"/>
    </g>

    <!-- viaduct -->
    <g opacity=".92">
      <path d="M24 350C161 305 286 313 416 350" fill="none" stroke="#c9b18b" stroke-width="28"/>
      <path d="M26 348C165 304 288 313 418 349" fill="none" stroke="#6e5841" stroke-width="5"/>
      <path d="M81 335v112M146 319v128M214 315v132M285 322v125M354 335v112" stroke="#8f765b" stroke-width="15"/>
      <path d="M63 447q18-50 36 0M127 447q19-59 38 0M194 447q20-60 40 0M264 447q20-56 40 0M334 447q19-48 38 0" fill="none" stroke="#c9b18b" stroke-width="14"/>
    </g>

    <!-- train -->
    <g transform="translate(52 292) rotate(4)" filter="url(#shadow)">
      <path d="M0 30C90 0 204-4 323 14c39 6 66 18 86 38-16 25-38 35-75 36C214 89 93 72 0 56z" fill="#f7fafc" stroke="#164c7b" stroke-width="4"/>
      <path d="M13 38C114 16 218 18 331 32" fill="none" stroke="#1478c8" stroke-width="12"/>
      <path d="M55 33l18 3M91 29l18 3M127 27l18 3M163 26l18 3M199 27l18 3M235 30l18 3M271 34l18 3" stroke="#123b62" stroke-width="11" stroke-linecap="round"/>
      <path d="M332 30c26 4 46 12 61 25-14 11-30 15-51 15z" fill="#0c3153"/>
    </g>

    <!-- orange Mustang Mach-E inspired crossover -->
    <g transform="translate(248 334)" filter="url(#shadow)">
      <path d="M18 70c14-45 41-76 87-89 43-12 104-8 138 14 20 13 34 37 39 66l8 46H6z" fill="url(#orange)" stroke="#7d3300" stroke-width="5"/>
      <path d="M73 42c17-30 39-44 70-48 37-5 68 0 91 17l19 32z" fill="#12344c" stroke="#8bc7e4" stroke-width="4"/>
      <path d="M42 73c51-13 134-16 206-4l-11 34H49z" fill="#1c2630" stroke="#171717" stroke-width="3"/>
      <path d="M57 83c41-11 120-13 171-4" fill="none" stroke="#44515b" stroke-width="5"/>
      <path d="M64 58l31-5" stroke="#e8f7ff" stroke-width="10" stroke-linecap="round"/>
      <path d="M220 53l34 6" stroke="#e8f7ff" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="68" cy="107" rx="29" ry="29" fill="#20252c" stroke="#8d969d" stroke-width="7"/>
      <ellipse cx="227" cy="107" rx="29" ry="29" fill="#20252c" stroke="#8d969d" stroke-width="7"/>
      <path d="M132 82q14-10 28 0q-5 10-14 12q-9-2-14-12z" fill="#d9e0e5"/>
    </g>

    <!-- AI label -->
    <g transform="translate(373 474)">
      <rect width="120" height="26" rx="13" fill="#0b3b74" opacity=".95"/>
      <text x="60" y="18" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="white">AI-GENERERET</text>
    </g>
  </g>
  <rect x="5" y="5" width="502" height="502" rx="69" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="10"/>
</svg>